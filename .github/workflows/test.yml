name: Validate Dash and browser apps
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -r requirements-render.txt
      - run: python -m pytest -q tests/test_python.py tests/test_hosting.py tests/test_datamonkey.py
      - run: python -m gunicorn --check-config --config gunicorn.conf.py wsgi:server
      - run: python scripts/gunicorn_smoke.py
      - run: python scripts/dash_smoke.py --browser /usr/bin/google-chrome
        env:
          SHIFT_HAPPENS_HOSTED: "true"
      - run: python scripts/browser_smoke.py --browser /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: .artifacts/
